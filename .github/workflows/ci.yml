name: Project Tarbook CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  packages: write

jobs:
  backend-verify:
    name: Backend Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
          cache-dependency-path: 'backend/pom.xml'

      - name: Build & Run Unit Tests
        working-directory: backend
        run: |
          chmod +x mvnw
          ./mvnw -B test

  quartz-verify:
    name: Quartz Documentation Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'quartz/package-lock.json'

      - name: Install Dependencies
        working-directory: quartz
        run: npm ci --legacy-peer-deps

      - name: Build Quartz Static Site
        working-directory: quartz
        run: node ./quartz/bootstrap-cli.mjs build

  publish-container:
    name: Build & Publish Container Images
    needs: [backend-verify, quartz-verify]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Backend Docker Metadata
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/backend
          tags: |
            type=sha,format=long
            type=raw,value=latest

      - name: Build and Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extract Quartz Docker Metadata
        id: meta-quartz
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/quartz
          tags: |
            type=sha,format=long
            type=raw,value=latest

      - name: Build and Push Quartz Image
        uses: docker/build-push-action@v5
        with:
          context: ./quartz
          file: ./quartz/Dockerfile
          push: true
          tags: ${{ steps.meta-quartz.outputs.tags }}
          labels: ${{ steps.meta-quartz.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
